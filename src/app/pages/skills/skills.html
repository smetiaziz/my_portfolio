<div class="min-h-screen p-12 bg-netflixDark">
  <h1 class="text-4xl text-center mb-12">Skills</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
    <div *ngFor="let skill of skills" class="bg-gray-800 p-6 rounded-lg transform transition hover:-translate-y-2">
      <h3 class="text-red-600 font-bold mb-3">{{ skill.category }}</h3>
      <div class="flex flex-wrap gap-2">
        <span *ngFor="let tag of skill.tags" class="bg-gray-700 px-3 py-1 rounded-full text-gray-200 hover:bg-red-600 transform hover:scale-105 transition">{{ tag }}</span>
      </div>
    </div>
  </div>
</div>
