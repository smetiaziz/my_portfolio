<div class="min-h-screen px-4 pt-28 bg-netflixDark">
  <h1 class="text-4xl text-center mb-12 text-white">Skills</h1>

  <div class="max-w-6xl mx-auto space-y-10 pb-8">
    <section *ngFor="let group of skills" class="text-center">
      <h2 class="text-2xl text-red-600 font-bold mb-4">{{ group.category }}</h2>

      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6 justify-items-center skills-grid">
        <div *ngFor="let skill of group.tags" class="skill-box">
          <div class="skill-logo-wrap">
            <img [src]="skill.logo" [alt]="skill.name" (error)="onLogoError($event)" class="skill-logo"/>
          </div>
          <div class="skill-name">{{ skill.name }}</div>
        </div>
      </div>
    </section>
  </div>
</div>
