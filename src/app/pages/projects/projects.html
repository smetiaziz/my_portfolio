<div class="min-h-screen p-12 bg-netflixDark">
  <h1 class="text-4xl text-center mb-12">Projects</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-6xl mx-auto">
    <div *ngFor="let project of projects" class="bg-gray-800 p-6 rounded-lg transform transition hover:-translate-y-2">
      <h3 class="text-xl font-semibold mb-2">{{ project.title }}</h3>
      <p class="text-gray-300 mb-2">{{ project.description }}</p>
      <a [href]="project.link" class="text-red-600 hover:underline">View Project</a>
    </div>
  </div>
</div>
