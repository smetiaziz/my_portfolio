<div class="min-h-screen p-12 bg-netflixDark">
  <h1 class="text-4xl text-center mb-12 text-white">Contact</h1>
  <div class="max-w-xl mx-auto space-y-4">
    <input type="email" [(ngModel)]="email" placeholder="Your Email" class="w-full p-3 rounded bg-gray-700 text-white" />
    <textarea [(ngModel)]="message" placeholder="Your Message" rows="6" class="w-full p-3 rounded bg-gray-700 text-white"></textarea>
    <button (click)="sendMessage()" class="bg-red-600 text-white px-6 py-2 rounded hover:bg-red-500">Send Message</button>
  </div>
</div>
