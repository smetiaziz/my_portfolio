<div class="min-h-screen pt-28 px-12 bg-netflixDark">
  <h1 class="text-4xl text-center mb-12 text-white">Experience</h1>
  <div class="max-w-4xl mx-auto space-y-8 pb-8">
    <div *ngFor="let exp of experiences" class="bg-gray-800 p-6 rounded-lg border-l-4 border-red-600">
      <div class="flex flex-col md:flex-row md:items-baseline md:justify-between">
        <div>
          <h3 class="text-xl font-semibold mb-1 text-white">{{ exp.title }}</h3>
          <p class="text-red-600 font-bold">{{ exp.company }}</p>
        </div>
        <p class="text-gray-400 mt-1 md:mt-0">{{ exp.duration }}</p>
      </div>
      <ul class="list-disc list-inside text-gray-300 mt-3 space-y-1">
        <li *ngFor="let b of exp.bullets">{{ b }}</li>
      </ul>
    </div>

    <div class="pt-4">
      <h2 class="text-4xl text-center mb-12 text-white">Education</h2>
      <div class="space-y-4">
        <div *ngFor="let ed of education" class="bg-gray-800 p-6 rounded-lg">
          <div class="flex flex-col md:flex-row md:items-baseline md:justify-between">
            <h3 class="text-lg font-semibold text-white">{{ ed.school }}</h3>
            <span class="text-gray-400">{{ ed.period }}</span>
          </div>
          <p class="text-gray-200 mt-1">{{ ed.degree }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
