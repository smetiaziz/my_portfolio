<div class="p-12 bg-gray-900 text-white">
  <h2 class="text-2xl font-semibold mb-6">Top Picks</h2>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <button *ngFor="let pick of picks"
            (click)="go(pick)"
            type="button"
            class="relative cursor-pointer rounded-lg overflow-hidden aspect-video transform transition-transform hover:scale-105 text-left focus:outline-none">
      <div [ngClass]="pick.bgClass || 'bg-gray-800'" class="w-full h-full flex items-center justify-center">
        <img *ngIf="pick.avatar" [src]="pick.avatar" [alt]="pick.title" class="absolute inset-0 w-full h-full object-cover" />
        <h4 class="text-2xl text-white z-10">{{ pick.title }}</h4>
      </div>
      <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 to-transparent p-4 transform translate-y-full transition-transform hover:translate-y-0">
        <h3 class="text-lg font-semibold">{{ pick.title }}</h3>
        <p class="text-gray-300 text-sm">{{ pick.description }}</p>
      </div>
    </button>
  </div>
</div>
